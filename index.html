<head>

<meta name="description" content="Moderne Websites für Cafés, Handwerk, Salons, Praxen, Kanzleien und Künstler.">

<title>allesodernetz.de – Websites mit Charakter</title>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#f5f6fa}
a{color:#1e2f6e}a:hover{color:#0c1330}
@keyframes rl-fade{from{opacity:0}to{opacity:1}}
@keyframes rl-pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes rl-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes rl-zoom{from{transform:scale(1.1)}to{transform:scale(1)}}
@keyframes rl-pulse{0%,100%{box-shadow:0 0 8px #f2a23a}50%{box-shadow:0 0 22px #f2a23a}}
@keyframes rl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes rl-steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes rl-flash{0%,100%{opacity:.85;filter:drop-shadow(0 0 0 rgba(255,210,63,0))}50%{opacity:1;filter:drop-shadow(0 0 26px rgba(255,210,63,.9))}}
@keyframes rl-sweep{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
@keyframes rl-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
@keyframes rl-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
@keyframes rl-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rl-overlay{animation:rl-fade .25s ease-out both}
.rl-window{animation:rl-pop .42s cubic-bezier(.2,.9,.25,1.05) both}
.rl-tile{transition:transform .3s ease, box-shadow .3s ease}
.rl-tile{position:relative !important;transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease, border-color .45s ease !important}
.rl-tile::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:18px;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.1) 50%,rgba(255,255,255,0) 62%);transform:translateX(-130%);transition:transform 1s ease;pointer-events:none;z-index:3}
.rl-tile:hover{transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(0,0,0,.8);border-color:rgba(242,162,58,.45) !important;background-color:rgba(255,255,255,.05) !important}
.rl-tile:hover::after{transform:translateX(130%)}
.rl-timg{filter:grayscale(.15) saturate(.92) brightness(.9);transition:transform 1.1s cubic-bezier(.2,.8,.2,1), filter .6s ease}
.rl-tile:hover .rl-timg{transform:scale(1.06);filter:none}
.rl-prev{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;opacity:0;transform:translateY(16px) scale(.98);transition:opacity .45s ease, transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:2}
.rl-tile:hover .rl-prev,.rl-tile:focus-visible .rl-prev{opacity:1;transform:none}
.rl-pi{opacity:0;transform:translateY(10px);transition:opacity .45s ease, transform .5s cubic-bezier(.2,.8,.2,1)}
.rl-tile:hover .rl-pi,.rl-tile:focus-visible .rl-pi{opacity:1;transform:none}
.rl-tile:hover .rl-pi2{transition-delay:.08s}.rl-tile:hover .rl-pi3{transition-delay:.16s}
.rl-plabel{transition:opacity .3s ease, transform .3s ease}
.rl-tile:hover .rl-plabel,.rl-tile:focus-visible .rl-plabel{opacity:0;transform:translateY(8px)}
.rl-arrow{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.rl-arrow{transition:transform .4s cubic-bezier(.2,.8,.2,1), background-color .3s ease, color .3s ease, border-color .3s ease}
.rl-tile:hover .rl-arrow{transform:rotate(45deg);background-color:#f2a23a;color:#0c1330;border-color:#f2a23a}
.rl-nav{background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat !important;transition:background-size .3s ease}
.rl-nav:hover{background-size:100% 1.5px !important}
.rl-cta{transition:transform .25s ease, box-shadow .25s ease, filter .25s ease}
.rl-cta:hover{transform:translateY(-3px);box-shadow:0 14px 32px -12px rgba(242,162,58,.7);filter:brightness(1.05)}
.rl-card{transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease}
.rl-card:hover{transform:translateY(-6px);box-shadow:0 22px 44px -24px rgba(0,0,0,.45)}
@keyframes rl-tick{0%,13%{transform:translateY(0)}16.6%,29.6%{transform:translateY(-1.1em)}33.3%,46.3%{transform:translateY(-2.2em)}50%,63%{transform:translateY(-3.3em)}66.6%,79.6%{transform:translateY(-4.4em)}83.3%,96.3%{transform:translateY(-5.5em)}100%{transform:translateY(-6.6em)}}
@keyframes rl-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rl-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rl-shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes rl-beam{0%{background-position:-60% 0;opacity:0}15%{opacity:1}85%{opacity:1}100%{background-position:160% 0;opacity:0}}
.rl-beam{background:linear-gradient(90deg,rgba(242,162,58,0),rgba(255,206,130,.95),rgba(242,162,58,0)) no-repeat;background-size:45% 100%;animation:rl-beam 7s ease-in-out infinite}
.rl-logo svg{transition:filter .35s ease, transform .35s cubic-bezier(.2,.8,.2,1)}
.rl-logotext{transition:text-shadow .35s ease}
.rl-logonet{transition:text-shadow .35s ease}
.rl-logo:hover .rl-logonet,.rl-logo:focus-visible .rl-logonet{text-shadow:0 0 14px rgba(242,162,58,.9)}
.rl-logo:hover .rl-logotext,.rl-logo:focus-visible .rl-logotext{text-shadow:0 0 18px rgba(242,162,58,.55)}
@keyframes rl-bob{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(8px);opacity:1}}
.rl-chev{animation:rl-bob 2.2s ease-in-out infinite}
.rl-chev:hover{color:#f2a23a}
.rl-dot{transition:transform .35s ease}
.rl-logo:hover .rl-dot,.rl-logo:focus-visible .rl-dot{transform:scale(1.6);box-shadow:0 0 18px 4px rgba(242,162,58,.85)}
.rl-tick{animation:rl-tick 12s cubic-bezier(.7,0,.3,1) infinite}
.rl-marq{animation:rl-marq 38s linear infinite}
.rl-spin{animation:rl-spin 22s linear infinite}
.rl-shine{background:linear-gradient(90deg,#f2a23a,#ffd28a,#f2a23a,#e07a2c);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rl-shine 6s ease-in-out infinite}
@keyframes rl-rv{from{opacity:0;translate:0 48px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
@supports (animation-timeline: view()){.rl-rv{animation:rl-rv linear both;animation-timeline:view();animation-range:entry 0% entry 75%}}
.rl-tile:focus-visible,.rl-btn:focus-visible{outline:3px solid #f2a23a;outline-offset:3px}
.rl-up{animation:rl-up .9s cubic-bezier(.2,.8,.2,1) both}
.rl-d1{animation-delay:.15s}.rl-d2{animation-delay:.3s}.rl-d3{animation-delay:.45s}
.rl-zoom{animation:rl-zoom 14s ease-out both}
.rl-pulse{animation:rl-pulse 2.6s ease-in-out infinite}
.rl-float{animation:rl-float 6s ease-in-out infinite}
.rl-steam{animation:rl-steam 2.8s ease-in-out infinite;transform-box:fill-box}
.rl-flash{animation:rl-flash 2.4s ease-in-out infinite}
.rl-sweep{animation:rl-sweep 7s ease-in-out infinite alternate}
.rl-drift{animation:rl-drift 9s ease-in-out infinite}
.rl-drift2{animation:rl-drift2 11s ease-in-out infinite}
.rl-line{animation:rl-line 1.2s cubic-bezier(.2,.8,.2,1) .3s both;transform-origin:left}
@keyframes rl-draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes rl-eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.rl-opt{transition:transform .25s ease, background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease}
.rl-opt:hover{border-color:#b9ab9a}
.rl-draw{stroke-dasharray:60;animation:rl-draw .8s ease-out .2s both}
.rl-eq{display:inline-block;width:4px;height:22px;border-radius:2px;background:#c8833a;transform-origin:bottom;animation:rl-eq 1s ease-in-out infinite}
.rl-eq-off{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.rl-overlay,.rl-window,.rl-up,.rl-zoom,.rl-pulse,.rl-float,.rl-steam,.rl-flash,.rl-sweep,.rl-drift,.rl-drift2,.rl-line,.rl-draw,.rl-eq,.rl-rv,.rl-tick,.rl-marq,.rl-spin,.rl-shine,.rl-beam,.rl-chev{animation:none}.rl-tile,.rl-opt,.rl-timg,.rl-arrow,.rl-card,.rl-cta{transition:none}.rl-tile::after{display:none}.rl-prev,.rl-pi,.rl-plabel{transition:none}}

<body>
<div id="app"></div>
<noscript><p style="font-family: system-ui, sans-serif; padding: 24px">Bitte JavaScript aktivieren. Oder schreib uns direkt: <a href="mailto:mail@allesodernetz.de">mail@allesodernetz.de</a></p></noscript>
<template id="dc-tpl">
<div style="font-family: Manrope, system-ui, sans-serif; color: #111633; background: #f5f6fa; line-height: 1.55; font-size: 17px">

<section style="position: relative; min-height: 680px; display: flex; flex-direction: column; overflow: hidden; background: #0c1330; color: #ffffff">
<img class="rl-zoom" src="/img/fe8effce46814972c9aa1892d8a447b1.jpg" alt="Stadt am Fluss bei Nacht mit beleuchteter Brücke" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% center">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(12,19,48,.72) 0%, rgba(12,19,48,.48) 35%, rgba(12,19,48,.72) 65%, rgba(12,19,48,.94) 88%, #0c1330 100%)" aria-hidden="true"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(180deg, rgba(12,19,48,0) 0%, rgba(12,19,48,.85) 70%, #0c1330 100%)" aria-hidden="true"></div>
<header style="position: relative; max-width: 1160px; width: 100%; margin: 0 auto; padding: 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="#top" class="rl-logo" aria-label="allesodernetz.de – zur Startseite" style="color: #ffffff; text-decoration: none; display: flex; align-items: baseline; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1"><span class="rl-logotext">allesodernetz</span><span class="rl-pulse rl-dot" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f2a23a; margin: 0 3px 0 4px" aria-hidden="true"></span><span class="rl-logonet" style="color: #f2a23a">de</span></a>
<nav aria-label="Hauptnavigation" style="display: flex; gap: 24px; font-size: 15px; font-weight: 600">
<button type="button" class="rl-nav" onClick="{{pageGo.beispiele}}" style="all: unset; cursor: pointer; color: #ffffff; min-height: 44px; display: inline-flex; align-items: center">Beispiele</button>
<button type="button" class="rl-nav" onClick="{{pageGo.leistungen}}" style="all: unset; cursor: pointer; color: #ffffff; min-height: 44px; display: inline-flex; align-items: center">Leistungen</button>
<button type="button" class="rl-nav" onClick="{{pageGo.kontakt}}" style="all: unset; cursor: pointer; color: #ffffff; min-height: 44px; display: inline-flex; align-items: center">Kontakt</button>
</nav>
</header>
<div id="top" style="position: relative; flex: 1; max-width: 1160px; width: 100%; margin: 0 auto; padding: 0 24px 120px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px">
<h1 class="rl-up" style="margin: 0; font-size: 72px; line-height: 1.1; letter-spacing: -0.035em; font-weight: 800; max-width: 820px; text-shadow: 0 2px 24px rgba(0,0,0,.35)">Websites für<br><span style="display: inline-block; height: 1.1em; overflow: hidden; vertical-align: bottom"><span class="rl-tick" style="display: flex; flex-direction: column"><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Cafés.</span><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Handwerk.</span><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Salons.</span><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Kanzleien.</span><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Praxen.</span><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Künstler.</span><span class="rl-shine" style="display: block; height: 1.1em; line-height: 1.1">Cafés.</span></span></span></h1>
<p class="rl-up rl-d1" style="margin: 0; font-size: 21px; color: #e4e8f5; max-width: 560px">Für alle, die mit Leidenschaft arbeiten. Persönlich gestaltet, schnell online, selbst pflegbar.</p>
<div class="rl-up rl-d2" style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px">
<a href="#beispiele" class="rl-cta" style="background: #f2a23a; color: #0c1330; padding: 14px 24px; border-radius: 999px; font-weight: 800; text-decoration: none; min-height: 44px; box-sizing: border-box">Beispiele ansehen</a>
<a href="#kontakt" class="rl-cta" style="border: 1.5px solid rgba(255,255,255,.7); color: #ffffff; padding: 13px 23px; border-radius: 999px; font-weight: 700; text-decoration: none; min-height: 44px; box-sizing: border-box">Anrufen</a>
</div>
</div>
<button type="button" onClick="{{pageGo.beispiele}}" class="rl-chev" aria-label="Weiter zu den Beispielen" style="all: unset; cursor: pointer; position: absolute; left: 50%; bottom: 22px; margin-left: -24px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none; z-index: 2"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
</section>

<section id="beispiele" style="position: relative; overflow: hidden; padding: 96px 0 96px; background: #0c1330; color: #ffffff">
<span class="rl-float" style="position: absolute; right: -180px; top: 220px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(242,162,58,.09) 0%, rgba(242,162,58,0) 65%); pointer-events: none" aria-hidden="true"></span>
<span class="rl-drift" style="position: absolute; left: -220px; bottom: -120px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(90,120,255,.08) 0%, rgba(90,120,255,0) 65%); pointer-events: none" aria-hidden="true"></span>
<div style="position: relative; max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #f2a23a">Beispiele</span>
<h2 class="rl-rv" style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1">So könnte deine Website aussehen.</h2>
</div>
<p style="margin: 0; color: #aab2cc; font-size: 15px">Zum Öffnen antippen.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px">
<button type="button" class="rl-tile rl-rv" onClick="{{openCafe}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 14px; padding: 10px 10px 14px; box-sizing: border-box; border-radius: 18px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); color: #ffffff">
